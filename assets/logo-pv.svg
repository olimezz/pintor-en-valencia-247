<!--
  LOGOTIPO MONOGRAMA "PV" (ESTILO ARCOÍRIS) — PINTOR EN VALENCIA 24/7
  Referencia original: https://pintorenvalencia247.es
  NOTA PARA SUSTITUCIÓN DIRECTA:
  Si dispones del archivo rasterizado o vectorial descargado directamente del servidor
  de https://pintorenvalencia247.es (ej. /wp-content/uploads/.../logo-pv.png),
  puedes reemplazar este archivo o actualizar la ruta en index.html (<img class="logo-original-img">).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="pvLogoTitle pvLogoDesc">
  <title id="pvLogoTitle">Pintor en Valencia 24/7 — Logotipo Monograma PV</title>
  <desc id="pvLogoDesc">Monograma con las letras P y V en degradado arcoíris para Pintor en Valencia 24/7</desc>
  <defs>
    <!-- Degradado arcoíris principal para la letra P y el anillo -->
    <linearGradient id="pvRainbowMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="20%" stop-color="#F97316" />
      <stop offset="40%" stop-color="#EAB308" />
      <stop offset="62%" stop-color="#10B981" />
      <stop offset="82%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <!-- Degradado arcoíris cálido-frío para la letra P -->
    <linearGradient id="pvGradP" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="38%" stop-color="#F97316" />
      <stop offset="75%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <!-- Degradado arcoíris frío-violeta para la letra V -->
    <linearGradient id="pvGradV" x1="10%" y1="15%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="32%" stop-color="#10B981" />
      <stop offset="68%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="pvSoftShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Fondo limpio con borde arcoíris sutil -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="#FFFFFF" stroke="url(#pvRainbowMain)" stroke-width="4.5" filter="url(#pvSoftShadow)" />

  <!-- Monograma "P" -->
  <path
    d="M28 88V32H51C62.6 32 70 39.1 70 49.5C70 59.9 62.6 67 51 67H40.5V88H28ZM40.5 56H49.8C55.1 56 57.8 53.3 57.8 49.5C57.8 45.7 55.1 43 49.8 43H40.5V56Z"
    fill="url(#pvGradP)"
  />

  <!-- Monograma "V" entrelazado con trazo de brocha limpio -->
  <path
    d="M55 46L70.5 88H82.5L98 32H85.2L76.5 68.8L66.8 41.5C64.2 44.2 60.1 45.6 55 46Z"
    fill="url(#pvGradV)"
  />

  <!-- Detalle superior de gota/rodillo arcoíris -->
  <circle cx="91.5" cy="24" r="4" fill="#F43F5E" />
</svg>
