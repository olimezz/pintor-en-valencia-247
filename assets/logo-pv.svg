<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Logotipo PV Pintor en Valencia 24/7">
  <defs>
    <!-- Degradado fiel al monograma original P (rojo -> naranja -> ámbar cálido) -->
    <linearGradient id="pvOrigP" x1="10%" y1="15%" x2="95%" y2="80%">
      <stop offset="0%" stop-color="#FF1E00" />
      <stop offset="52%" stop-color="#FF5E00" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>
    <!-- Degradado fiel al monograma original V (azul intenso -> verde esmeralda -> amarillo vivo) -->
    <linearGradient id="pvOrigV" x1="12%" y1="75%" x2="92%" y2="12%">
      <stop offset="0%" stop-color="#0038FF" />
      <stop offset="48%" stop-color="#059669" />
      <stop offset="76%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <linearGradient id="pvRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E00" />
      <stop offset="22%" stop-color="#FF7A00" />
      <stop offset="44%" stop-color="#FACC15" />
      <stop offset="66%" stop-color="#10B981" />
      <stop offset="85%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="112" height="112" rx="26" fill="#FFFFFF" stroke="url(#pvRing)" stroke-width="4.5" />

  <!-- Letra "P" inclinada con remate superior izquierdo fiel al icono original -->
  <path
    d="M20 18H56C72 18 81 26.5 78.8 40.5C76.5 54.8 65.2 63 48.5 63H34.2L30.5 82H16L25.2 26L20 18ZM36.5 50.5H47.8C56.4 50.5 62.2 46.2 63.4 39.2C64.5 32.5 59.8 29.5 51.5 29.5H40.4L36.5 50.5Z"
    fill="url(#pvOrigP)"
  />

  <!-- Letra "V" entrelazada bajo la panza de la P (azul -> verde -> amarillo) -->
  <path
    d="M39 59H55.2L65.2 87.5L88.5 43H104.5L68.2 106H56.5L39 59Z"
    fill="url(#pvOrigV)"
  />
</svg>
